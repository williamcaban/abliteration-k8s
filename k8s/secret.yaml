# HuggingFace token — only needed if MODEL_ID is used (downloading from HF Hub).
# If using a pre-downloaded model on model-input-pvc, this secret is optional.
#
# Create with:
#   kubectl create secret generic hf-token \
#     --from-literal=token=hf_XXXX \
#     -n abliteration
#
# Or apply this template after replacing the placeholder:
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: abliteration
type: Opaque
stringData:
  token: "hf_REPLACE_ME"
